name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15          # GitHub-hosted release build
    permissions:
      contents: write          # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tag must match VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - run: swift test -j 2
      - run: scripts/build-app.sh build --universal
      - run: tests/states.sh build/QuotaBar.app
      - run: tests/statusline.sh build/QuotaBar.app
      - name: zip
        run: |
          ditto -c -k --keepParent build/QuotaBar.app "QuotaBar-$(cat VERSION).zip"
          shasum -a 256 "QuotaBar-$(cat VERSION).zip" | tee SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's section of CHANGELOG.md, then the provenance line.
          awk -v v="## $(cat VERSION)" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
          printf '\nBuilt from commit %s by .github/workflows/release.yml on a GitHub-hosted runner. SHA-256: %s. SHA-256 is provided in SHA256SUMS.\n' \
            "$GITHUB_SHA" "$(cut -d' ' -f1 SHA256SUMS)" >> notes.md
          gh release create "$GITHUB_REF_NAME" "QuotaBar-$(cat VERSION).zip" SHA256SUMS \
            --title "QuotaBar $(cat VERSION)" --notes-file notes.md
